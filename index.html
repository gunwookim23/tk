<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--me:#3b82f6;--meText:#fff;--other:#e9ebef;--text:#1f2328;--sub:#8a8f98;--line:#e3e5e8}
  @media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1b1e23;--me:#3b82f6;--other:#2a2e35;--text:#e8eaed;--sub:#8a8f98;--line:#2c3037}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
  .hidden{display:none!important}
  #err{position:fixed;top:0;left:0;right:0;z-index:10;background:#fde8e8;color:#9b1c1c;font-size:13px;line-height:1.5;padding:10px 16px;white-space:pre-wrap;text-align:center}
  /* 입장 화면 */
  #join{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
  .box{background:var(--card);border-radius:16px;padding:28px 22px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
  .box h1{font-size:22px;margin-bottom:6px}
  .box p{font-size:13px;color:var(--sub);margin-bottom:20px}
  .box input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:10px;background:var(--bg);color:var(--text)}
  .box button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--me);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  /* 채팅 화면 */
  #chat{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--card)}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
  header b{font-size:16px}
  header small{color:var(--sub);font-size:12px;margin-left:6px}
  header button{background:none;border:0;color:var(--sub);font-size:13px;cursor:pointer}
  #list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;flex-direction:column;max-width:78%}
  .row.me{align-self:flex-end;align-items:flex-end}
  .row.other{align-self:flex-start;align-items:flex-start}
  .name{font-size:11px;color:var(--sub);margin:4px 4px 2px}
  .line{display:flex;align-items:flex-end;gap:5px}
  .row.me .line{flex-direction:row-reverse}
  .bubble{padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .me .bubble{background:var(--me);color:var(--meText);border-bottom-right-radius:4px}
  .other .bubble{background:var(--other);border-bottom-left-radius:4px}
  .time{font-size:10px;color:var(--sub);white-space:nowrap}
  .day{align-self:center;font-size:11px;color:var(--sub);margin:10px 0}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:15px;font-family:inherit;max-height:120px;background:var(--bg);color:var(--text)}
  form button{border:0;background:var(--me);color:#fff;border-radius:20px;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div id="err" class="hidden"></div>
<div id="join">
  <div class="box">
    <h1>Talk</h1>
    <p>같은 방 코드를 입력한 사람끼리 대화해요.<br>방 코드는 길고 남들이 못 맞힐 걸로 정하세요.</p>
    <input id="nick" placeholder="닉네임" maxlength="20">
    <input id="room" placeholder="방 코드 (예: gw-kim-room-8371)" maxlength="40">
    <button id="enter">입장</button>
  </div>
</div>

<div id="chat" class="hidden">
  <header>
    <div><b id="roomTitle"></b><small id="meName"></small></div>
    <button id="leave">나가기</button>
  </header>
  <div id="list"></div>
  <form id="send">
    <textarea id="msg" rows="1" placeholder="메시지 입력"></textarea>
    <button>전송</button>
  </form>
</div>

<script>
// 서버: ntfy.sh (무료 공개 메시지 서버, 가입·설정 필요 없음)
// 서버에는 최근 약 12시간치만 남고, 각자 기기에는 계속 저장돼요.
const SERVER = "https://ntfy.sh/";
const PREFIX = "tk7-room-";

const $ = id => document.getElementById(id);
function showErr(msg){ const e = $("err"); e.textContent = msg; e.classList.toggle("hidden", !msg); }

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} }
};
let myId = store.get("talk_id") || Math.random().toString(36).slice(2,10);
store.set("talk_id", myId);

let es = null, me = "", room = "", msgs = {};

$("nick").value = store.get("talk_nick") || "";
$("room").value = store.get("talk_room") || "";

function topic(){ return PREFIX + room.replace(/[^A-Za-z0-9_-]/g, c => c.charCodeAt(0).toString(36)).slice(0,64); }
function histKey(){ return "talk_hist_" + room; }

function enter(){
  const nick = $("nick").value.trim(), r = $("room").value.trim();
  if(!nick || !r) return alert("닉네임과 방 코드를 입력해 주세요.");
  me = nick; room = r;
  store.set("talk_nick", nick); store.set("talk_room", r);
  $("roomTitle").textContent = r;
  $("meName").textContent = "· " + nick;
  $("join").classList.add("hidden"); $("chat").classList.remove("hidden");
  try{ msgs = JSON.parse(store.get(histKey()) || "{}"); }catch{ msgs = {}; }
  render();
  connect();
  $("msg").focus();
}

function connect(){
  if(es) es.close();
  es = new EventSource(SERVER + topic() + "/sse?since=all");
  es.onopen = () => showErr("");
  es.onmessage = ev => {
    let d; try{ d = JSON.parse(ev.data); }catch{ return; }
    if(d.event !== "message" || !d.message) return;
    let m; try{ m = JSON.parse(d.message); }catch{ return; }
    if(!m.text) return;
    msgs[d.id] = { name: m.name || "?", uid: m.uid, text: m.text, t: d.time * 1000 };
    save(); render();
  };
  es.onerror = () => showErr("⚠️ 서버에 연결 중이에요… 계속 이러면 네트워크에서 ntfy.sh가 막혀 있을 수 있어요.");
}

function save(){
  const arr = Object.entries(msgs).sort((a,b) => a[1].t - b[1].t).slice(-500);
  msgs = Object.fromEntries(arr);
  store.set(histKey(), JSON.stringify(msgs));
}

function render(){
  const list = $("list"); list.innerHTML = "";
  let lastDay = "";
  Object.values(msgs).sort((a,b) => a.t - b.t).forEach(m => {
    const dt = new Date(m.t);
    const day = dt.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
    if(day !== lastDay){
      const el = document.createElement("div"); el.className = "day"; el.textContent = day;
      list.appendChild(el); lastDay = day;
    }
    const mine = m.uid === myId;
    const row = document.createElement("div"); row.className = "row " + (mine ? "me" : "other");
    if(!mine){ const n = document.createElement("div"); n.className = "name"; n.textContent = m.name; row.appendChild(n); }
    const line = document.createElement("div"); line.className = "line";
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.text;
    const t = document.createElement("div"); t.className = "time";
    t.textContent = dt.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"});
    line.append(b, t); row.appendChild(line); list.appendChild(row);
  });
  list.scrollTop = list.scrollHeight;
}

async function send(e){
  e.preventDefault();
  const text = $("msg").value.trim();
  if(!text) return;
  $("msg").value = ""; resize();
  try{
    const res = await fetch(SERVER + topic(), { method: "POST", body: JSON.stringify({ name: me, uid: myId, text }) });
    if(!res.ok) throw new Error("HTTP " + res.status);
  }catch(err){
    $("msg").value = text; resize();
    alert("전송 실패: " + err.message + "\n인터넷 연결을 확인해 주세요.");
  }
}

function resize(){ const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight,120) + "px"; }

$("enter").onclick = enter;
$("room").addEventListener("keydown", e => { if(e.key === "Enter") enter(); });
$("send").addEventListener("submit", send);
$("msg").addEventListener("input", resize);
$("msg").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("send").requestSubmit(); }
});
$("leave").onclick = () => {
  if(es) es.close(); es = null; store.del("talk_room"); showErr("");
  $("chat").classList.add("hidden"); $("join").classList.remove("hidden");
};

if(store.get("talk_nick") && store.get("talk_room")) enter();
</script>
</body>
</html>
