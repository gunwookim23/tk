<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note</title>
<link id="favicon" rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f3f4f6">
<style>
  :root{
    --bg:#f3f4f6; --card:#f7f8fa; --me:#dfe5ee; --other:#e9ebef;
    --text:#2b2f36; --sub:#6b7280; --line:#e2e5ea; --accent:#5b6b82;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;background:var(--bg);color:var(--text)}
  .hidden{display:none!important}
  #err{pointer-events:none;opacity:.95;position:fixed;top:0;left:0;right:0;z-index:10;background:#fde8e8;color:#9b1c1c;font-size:13px;line-height:1.5;padding:10px 16px;white-space:pre-wrap;text-align:center}
  /* 입장 화면 */
  #join{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
  .box{background:#fff;border-radius:12px;padding:28px 22px;width:100%;max-width:360px;border:1px solid var(--line)}
  .box h1{font-size:20px;margin-bottom:6px;color:var(--accent)}
  .box p{font-size:13px;color:var(--sub);margin-bottom:20px;line-height:1.5}
  .box input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:10px;background:var(--bg);color:var(--text)}
  .box button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  /* 채팅 화면 */
  #chat{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--card)}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
  header b{font-size:15px;color:var(--accent)}
  header small{color:var(--sub);font-size:12px;margin-left:6px}
  header button{background:none;border:0;color:var(--sub);font-size:13px;cursor:pointer;margin-left:10px}
  #list{flex:1;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column}
  .msg{display:flex;flex-direction:column;max-width:80%;margin-top:3px}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.other{align-self:flex-start;align-items:flex-start}
  .msg.first{margin-top:14px}
  .meta{font-size:12px;color:var(--sub);margin:0 2px 4px}
  .meta b{color:#4b5563;font-weight:600;margin-right:6px}
  .bubble{padding:9px 14px;border-radius:6px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .line{display:flex;align-items:flex-end;gap:6px}
  .me .line{flex-direction:row-reverse}
  .rd{font-size:11px;font-weight:700;color:#d49a00;padding-bottom:2px}
  .me .bubble{background:var(--me)}
  .other .bubble{background:var(--other)}
  .day{align-self:center;font-size:11px;color:var(--sub);margin:16px 0 2px;padding:3px 10px;border-radius:10px;background:var(--line)}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;max-height:120px;background:var(--bg);color:var(--text)}
  form button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
  /* 잠금 화면 */
  #lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  #lock h2{font-size:17px;color:var(--accent)}
  #lock p{font-size:13px;color:var(--sub);min-height:18px}
  #pinDots{display:flex;gap:12px}
  #pinDots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent)}
  #pinDots i.on{background:var(--accent)}
  #pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;margin-top:6px}
  #pad button{height:56px;border:0;border-radius:12px;background:#fff;font-size:22px;color:var(--text);cursor:pointer}
  #pad button.fn{background:none;font-size:14px;color:var(--sub)}
  #bioBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;font-size:14px;color:var(--accent);cursor:pointer}
  #forgot{background:none;border:0;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:6px}
</style>
</head>
<body>

<div id="err" class="hidden"></div>
<div id="join">
  <div class="box">
    <h1>Note</h1>
    <p>같은 방 코드를 입력한 사람끼리 대화해요.<br>방 코드는 길고 남들이 못 맞힐 걸로 정하세요.</p>
    <input id="nick" placeholder="닉네임" maxlength="20">
    <input id="room" placeholder="방 코드 (예: gw-kim-room-8371)" maxlength="40">
    <button id="enter">입장</button>
  </div>
</div>

<div id="chat" class="hidden">
  <header>
    <div><b id="roomTitle"></b><small id="meName"></small></div>
    <div>
      <button id="ntfy" title="워치/진동 알림">🔔</button>
      <button id="vib"></button>
      <button id="lockSet" title="잠금 설정">🔒</button>
      <button id="clear" title="내 폰에서 대화 지우기">🗑</button>
      <button id="link" title="내 다른 기기 연결">🔗</button>
      <button id="leave">나가기</button>
    </div>
  </header>
  <div id="list"></div>
  <form id="send">
    <textarea id="msg" rows="1" placeholder="메시지 입력"></textarea>
    <button>전송</button>
  </form>
</div>

<div id="lock" class="hidden">
  <h2 id="lockTitle">Note</h2>
  <div id="pinDots"></div>
  <p id="lockMsg"></p>
  <div id="pad"></div>
  <button id="bioBtn" class="hidden">👆 지문으로 열기</button>
  <button id="forgot" class="hidden">비밀번호를 잊었어요</button>
</div>

<script>
"use strict";
/* ───────── 설정 ─────────
   서버: ntfy.sh (무료 공개 메시지 서버, 가입 필요 없음)
   서버에는 최근 약 12시간치만 남고, 각자 기기에는 최근 500개까지 저장 */
const SERVER = "https://ntfy.sh/";
const PREFIX = "tk7-room-";
const MAX_KEEP = 500;               // 기기에 저장하는 최대 메시지 수
const GROUP_GAP = 5 * 60 * 1000;    // 같은 사람이 5분 안에 이어 보내면 이름/시간 생략
const LOCK_AFTER = 10 * 1000;       // 다른 앱에 10초 이상 있다 오면 다시 잠금
// 무료 서버 요청 한도(429) 때문에 요청을 아껴 써요
const READ_GAP = 10 * 1000;         // 읽음 신호: 최소 10초 간격 (답장할 땐 메시지에 같이 실어 보냄)
const PING_GAP = 30 * 1000;         // 진동 신호: 같은 사람에게 30초에 한 번만 (연달아 보내도 진동 1번)

/* ───────── 공통 ───────── */
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const post = (url, obj) => fetch(url, { method: "POST", body: JSON.stringify(obj) });
const fmtDay  = new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
const fmtTime = new Intl.DateTimeFormat("ko-KR", { hour: "numeric", minute: "2-digit" });
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function showErr(msg){ const e = $("err"); e.textContent = msg; e.classList.toggle("hidden", !msg); }

const myId = store.get("talk_id") || Math.random().toString(36).slice(2, 10);
store.set("talk_id", myId);
// 같은 사람의 다른 기기에서 예전에 쓰던 ID들 (기기 연결 시 합쳐짐)
const aliases = new Set((() => { try{ return JSON.parse(store.get("talk_alias") || "[]"); }catch{ return []; } })());
const isMine = uid => uid === myId || aliases.has(uid);

/* ───────── 상태 ───────── */
let es = null, me = "", room = "", tp = "";
let msgs = {};            // id → {name, uid, text, t}  (저장 형식)
let order = [];           // 시간순 메시지 배열 (화면용)
let reads = {};           // 상대 uid → 어디까지 읽었는지(시간)
let readUpTo = 0;         // 상대들이 읽은 가장 최근 시간
let pendingRd = [];       // 아직 "1"이 붙은 내 메시지 [{t, el}]
let others = new Set();   // 이 방의 다른 사람 uid
let latestOther = 0, lastReadSent = 0, clearedAt = 0, openedAt = 0, unread = 0;
let lastDay = "", lastMsg = null, saveTimer = 0;
let subs = {};                                   // 상대 uid → 진동 방식 "pg"(점) / "pc"(내용) / "off"
let mySub = store.get("talk_sub") || "";         // 내 ntfy 구독 방식 (🔔에서 고른 것)
let readTimer = 0, lastReadAt = 0, retryDelay = 5000, retryTimer = 0;
const lastPing = {};

/* ───────── 토픽 이름 (기존 구독과 호환되도록 그대로 유지) ───────── */
function hash(str){
  let a = 0x811c9dc5, b = 0x01000193;
  for(const ch of str){ a = Math.imul(a ^ ch.charCodeAt(0), 16777619) >>> 0; b = Math.imul(b ^ ch.charCodeAt(0), 2246822519) >>> 0; }
  return a.toString(16).padStart(8, "0") + b.toString(16).padStart(8, "0");
}
const makeTopic   = r => PREFIX + r.replace(/[^A-Za-z0-9_-]/g, c => c.charCodeAt(0).toString(36)).slice(0, 62);
const pingTopic    = uid => "pg-" + hash(tp + "|" + uid);    // 점만
const contentTopic = uid => "pc-" + hash(tp + "|c|" + uid);  // 이름 + 내용

/* ───────── 탭 아이콘 / 안 읽음 표시 ───────── */
const iconCache = {};
function setIcon(dot){
  if(!iconCache[dot]){
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d");
    g.fillStyle = "#d3d7de"; g.beginPath(); g.roundRect(10, 6, 44, 54, 6); g.fill();
    g.fillStyle = "#8c939e"; g.beginPath(); g.roundRect(10, 6, 44, 11, [6, 6, 0, 0]); g.fill();
    g.strokeStyle = "#5f6672"; g.lineWidth = 3; g.lineCap = "round";
    g.beginPath(); g.moveTo(18, 28); g.lineTo(46, 28); g.moveTo(18, 38); g.lineTo(46, 38); g.moveTo(18, 48); g.lineTo(36, 48); g.stroke();
    if(dot){ g.fillStyle = "#e5484d"; g.beginPath(); g.arc(50, 14, 13, 0, Math.PI * 2); g.fill(); g.strokeStyle = "#fff"; g.lineWidth = 3; g.stroke(); }
    iconCache[dot] = c.toDataURL("image/png");
  }
  $("favicon").href = iconCache[dot];
}
const isAway = () => document.hidden || !document.hasFocus();
function markUnread(){
  unread++; document.title = `(${unread}) Note`; setIcon(true);
  try{ navigator.setAppBadge && navigator.setAppBadge(unread); }catch{}
}
function clearUnread(){
  if(!unread) return;
  unread = 0; document.title = "Note"; setIcon(false);
  try{ navigator.clearAppBadge && navigator.clearAppBadge(); }catch{}
}

/* ───────── 화면 그리기 (새 메시지는 끝에만 덧붙여서 빠르게) ───────── */
function appendMsg(m, list){
  const dt = new Date(m.t), day = fmtDay.format(dt);
  const newDay = day !== lastDay;
  if(newDay){ list.appendChild(el("div", "day", day)); lastDay = day; }
  const mine = isMine(m.uid);
  const first = newDay || !lastMsg || lastMsg.uid !== m.uid || m.t - lastMsg.t > GROUP_GAP;
  const row = el("div", "msg " + (mine ? "me" : "other") + (first ? " first" : ""));
  if(first){
    const meta = el("div", "meta");
    if(!mine) meta.appendChild(el("b", null, m.name));
    meta.appendChild(document.createTextNode(fmtTime.format(dt)));
    row.appendChild(meta);
  }
  const line = el("div", "line");
  line.appendChild(el("div", "bubble", m.text));
  if(mine && m.t > readUpTo){ const r = el("span", "rd", "1"); line.appendChild(r); pendingRd.push({ t: m.t, el: r }); }
  row.appendChild(line); list.appendChild(row);
  lastMsg = m;
}
function renderAll(){
  const list = $("list"), frag = document.createDocumentFragment();
  lastDay = ""; lastMsg = null; pendingRd = [];
  for(const m of order) appendMsg(m, frag);
  list.replaceChildren(frag);
  list.scrollTop = list.scrollHeight;
}
function addMsg(id, m){
  msgs[id] = m;
  if(!isMine(m.uid)){ others.add(m.uid); if(m.t > latestOther) latestOther = m.t; }
  const list = $("list");
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  if(!lastMsg || m.t >= lastMsg.t){              // 보통: 맨 끝에 추가
    order.push(m); appendMsg(m, list);
    if(order.length > MAX_KEEP + 50) trim(); 
    else if(nearBottom || isMine(m.uid)) list.scrollTop = list.scrollHeight;
  } else {                                        // 드물게: 순서가 섞이면 전체 다시 그리기
    order.push(m); order.sort((a, b) => a.t - b.t); renderAll();
  }
  scheduleSave();
}
function trim(){
  order = order.slice(-MAX_KEEP);
  const keep = new Set(order);
  for(const k in msgs) if(!keep.has(msgs[k])) delete msgs[k];
  renderAll();
}
function updateReadMarks(){
  if(!pendingRd.length) return;
  pendingRd = pendingRd.filter(p => { if(p.t <= readUpTo){ p.el.remove(); return false; } return true; });
}

/* ───────── 저장 (모아서 한 번에) ───────── */
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set("talk_hist_" + room, JSON.stringify(msgs)), 400);
}

/* ───────── 읽음 신호 ───────── */
function sendRead(force){
  if(!room || isAway() || isLocked()) return;
  if(!force && latestOther <= lastReadSent) return;
  const wait = READ_GAP - (Date.now() - lastReadAt);
  if(wait > 0){ if(!readTimer) readTimer = setTimeout(() => { readTimer = 0; sendRead(force); }, wait); return; }
  lastReadAt = Date.now(); lastReadSent = latestOther;
  post(SERVER + tp + "-r", { type: "read", uid: myId, upTo: latestOther, sub: mySub || undefined }).catch(() => { lastReadSent = 0; });
}

/* ───────── 입장 / 연결 ───────── */
function enter(){
  const nick = $("nick").value.trim(), r = $("room").value.trim();
  if(!nick || !r) return alert("닉네임과 방 코드를 입력해 주세요.");
  me = nick; room = r; tp = makeTopic(r);
  store.set("talk_nick", nick); store.set("talk_room", r);
  $("roomTitle").textContent = r;
  $("meName").textContent = "· " + nick;
  $("join").classList.add("hidden"); $("chat").classList.remove("hidden");

  try{ msgs = JSON.parse(store.get("talk_hist_" + r) || "{}"); }catch{ msgs = {}; }
  try{ reads = JSON.parse(store.get("talk_reads_" + r) || "{}"); }catch{ reads = {}; }
  try{ subs = JSON.parse(store.get("talk_subs_" + r) || "{}"); }catch{ subs = {}; }
  clearedAt = +(store.get("talk_clear_" + r) || 0);
  for(const k in msgs) if(msgs[k].t <= clearedAt) delete msgs[k];
  order = Object.values(msgs).sort((a, b) => a.t - b.t).slice(-MAX_KEEP);
  for(const u of Object.keys(reads)) if(isMine(u)) delete reads[u];
  readUpTo = Math.max(0, ...Object.values(reads));
  others = new Set(Object.keys(reads)); latestOther = 0; lastReadSent = 0;
  for(const m of order) if(!isMine(m.uid)){ others.add(m.uid); if(m.t > latestOther) latestOther = m.t; }

  renderAll();
  connect();
  if(!isLocked()) $("msg").focus();
}

function applyRead(m){
  const up = m.upTo || 0;
  if(isMine(m.uid)){ if(up > lastReadSent) lastReadSent = up; return; }
  others.add(m.uid);
  if(m.sub && subs[m.uid] !== m.sub){ subs[m.uid] = m.sub; store.set("talk_subs_" + room, JSON.stringify(subs)); }
  if(up > (reads[m.uid] || 0)){
    reads[m.uid] = up; store.set("talk_reads_" + room, JSON.stringify(reads));
    if(up > readUpTo){ readUpTo = up; updateReadMarks(); }
  }
}
function onEvent(ev){
  let d; try{ d = JSON.parse(ev.data); }catch{ return; }
  if(d.event !== "message" || !d.message) return;
  let m;
  const tag = (d.tags || []).find(x => x.startsWith("u_"));     // 예전 형식 호환
  if(tag) m = { name: d.title || "?", uid: tag.slice(2), text: d.message };
  else { try{ m = JSON.parse(d.message); }catch{ return; } }

  if(m.type === "alias"){                       // 누군가 기기를 연결함: 예전 ID → 새 ID
    if(!m.old || m.old === myId) return;
    if(m.uid === myId && !aliases.has(m.old)){ aliases.add(m.old); store.set("talk_alias", JSON.stringify([...aliases])); }
    others.delete(m.old);
    if(subs[m.old] && !subs[m.uid]) subs[m.uid] = subs[m.old];
    delete subs[m.old];
    if(reads[m.old] !== undefined){
      if(!isMine(m.uid)) reads[m.uid] = Math.max(reads[m.uid] || 0, reads[m.old]);
      delete reads[m.old];
      store.set("talk_reads_" + room, JSON.stringify(reads));
    }
    if(!isMine(m.uid)) others.add(m.uid);
    readUpTo = Math.max(0, ...Object.values(reads));
    latestOther = 0;
    for(const x of order) if(!isMine(x.uid) && x.t > latestOther) latestOther = x.t;
    renderAll();
    return;
  }
  if(m.type === "read"){ applyRead(m); return; }

  const t = d.time * 1000;
  if(!m.text || msgs[d.id] || t <= clearedAt) return;
  addMsg(d.id, { name: m.name || "?", uid: m.uid, text: m.text, t });
  if(m.upTo || m.sub) applyRead(m);           // 답장에 실려 온 읽음 정보
  if(!isMine(m.uid)){
    if(t >= openedAt - 5000){ if(isAway()) markUnread(); buzz(); }
    sendRead();
  }
}
function connect(){
  if(es) es.close();
  openedAt = Date.now();
  clearTimeout(retryTimer);
  es = new EventSource(SERVER + tp + "," + tp + "-r/sse?since=all");
  es.onopen = () => { showErr(""); retryDelay = 5000; setTimeout(sendRead, 800); };
  es.onmessage = onEvent;
  es.onerror = () => {
    // 브라우저 자동 재연결은 몇 초마다 계속 요청해서 한도를 더 써버림 → 직접 끊고 점점 늦게 다시 연결
    es.close();
    showErr("⚠️ 서버 연결이 끊겼어요. " + Math.round(retryDelay / 1000) + "초 뒤 다시 연결해요…");
    retryTimer = setTimeout(() => { if(room) connect(); }, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 60000);
  };
}

/* ───────── 보내기 ───────── */
async function send(e){
  e.preventDefault();
  const box = $("msg"), text = box.value.trim();
  if(!text) return;
  box.value = ""; resize();
  box.focus();   // 키보드 유지 (뒤로가기 누를 때만 내려감)
  try{
    let res;
    for(const delay of [0, 3000, 8000]){                    // 요청 제한(429)이면 잠깐 기다렸다 재시도
      if(delay){ showErr("⏳ 서버가 잠시 바빠요. 다시 보내는 중…"); await new Promise(r => setTimeout(r, delay)); }
      res = await post(SERVER + tp, { name: me, uid: myId, text, upTo: latestOther, sub: mySub || undefined });
      if(res.status !== 429) break;
    }
    showErr("");
    if(res.status === 429) throw new Error("429");
    if(!res.ok) throw new Error("HTTP " + res.status);
    lastReadSent = Math.max(lastReadSent, latestOther); lastReadAt = Date.now();   // 읽음은 메시지에 실려 갔음
    const now = Date.now();
    for(const uid of others){                                 // 상대가 고른 방식 하나만, 30초에 한 번
      if(isMine(uid)) continue;
      if(now - (lastPing[uid] || 0) < PING_GAP) continue;
      lastPing[uid] = now;
      const k = subs[uid] || "pg";
      if(k === "pg") post(SERVER, { topic: pingTopic(uid), title: "·", message: "·" }).catch(() => {});
      else if(k === "pc") post(SERVER, { topic: contentTopic(uid), title: me, message: text }).catch(() => {});
    }
  }catch(err){
    box.value = text; resize();
    alert(err.message === "429"
      ? "전송 실패: 무료 서버의 요청 한도에 걸렸어요.\n1~2분 뒤 다시 보내주세요. (쓴 글은 입력창에 남아 있어요)"
      : "전송 실패: " + err.message + "\n인터넷 연결을 확인해 주세요.");
  }
}
function resize(){ const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }

/* ───────── 진동 ───────── */
let vibOn = store.get("talk_vib") !== "off";
function showVib(){ $("vib").textContent = vibOn ? "📳" : "🔕"; $("vib").title = vibOn ? "진동 켜짐" : "진동 꺼짐"; }
function buzz(){ if(vibOn && navigator.vibrate) try{ navigator.vibrate([150, 80, 150]); }catch{} }

/* ───────── 잠금 (PIN 4자리 + 지문) ───────── */
let pinBuf = "", pinMode = "unlock", pinFirst = "", hiddenAt = 0, pinBusy = false;
const dots = [];
async function sha(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
}
const hasPin = () => !!store.get("talk_pin");
const hasBio = () => !!store.get("talk_bio");
const bioOK  = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
const isLocked = () => !$("lock").classList.contains("hidden") && pinMode === "unlock";

function buildLock(){
  for(let i = 0; i < 4; i++){ const d = el("i"); dots.push(d); $("pinDots").appendChild(d); }
  for(const k of ["1","2","3","4","5","6","7","8","9","취소","0","⌫"]){
    const b = el("button", (k === "취소" || k === "⌫") ? "fn" : null, k);
    b.type = "button"; b.onclick = () => pressKey(k);
    $("pad").appendChild(b);
  }
}
function drawDots(){ dots.forEach((d, i) => d.classList.toggle("on", i < pinBuf.length)); }
function showLock(mode){
  pinMode = mode; pinBuf = ""; drawDots();
  const titles = { unlock: "비밀번호 입력", set1: "새 비밀번호 4자리", set2: "한 번 더 입력", check: "현재 비밀번호 입력" };
  $("lockTitle").textContent = titles[mode];
  $("lockMsg").textContent = "";
  const unlocking = mode === "unlock";
  $("pad").children[9].style.visibility = unlocking ? "hidden" : "visible";
  $("bioBtn").classList.toggle("hidden", !(unlocking && hasBio()));
  $("forgot").classList.toggle("hidden", !unlocking);
  $("lock").classList.remove("hidden");
  if(document.activeElement) document.activeElement.blur();
}
function hideLock(){ $("lock").classList.add("hidden"); pinBuf = ""; }

async function pressKey(k){
  if(pinBusy) return;
  if(k === "취소"){ if(pinMode !== "unlock") hideLock(); return; }
  if(k === "⌫"){ pinBuf = pinBuf.slice(0, -1); drawDots(); return; }
  if(pinBuf.length >= 4) return;
  pinBuf += k; drawDots();
  if(pinBuf.length < 4) return;
  pinBusy = true;
  const entered = pinBuf;
  await new Promise(r => setTimeout(r, 120));
  try{
    if(pinMode === "unlock" || pinMode === "check"){
      if(await sha("note|" + entered) === store.get("talk_pin")){
        const wasCheck = pinMode === "check";
        hideLock();
        if(wasCheck) lockMenu(true); else { sendRead(); $("msg").focus(); }
      } else {
        pinBuf = ""; drawDots(); $("lockMsg").textContent = "비밀번호가 틀렸어요";
        if(navigator.vibrate) navigator.vibrate(200);
      }
    } else if(pinMode === "set1"){
      pinFirst = entered; showLock("set2");
    } else if(pinMode === "set2"){
      if(entered === pinFirst){
        store.set("talk_pin", await sha("note|" + entered)); hideLock();
        if(bioOK() && confirm("비밀번호를 설정했어요.\n지문으로도 열 수 있게 할까요?")) setupBio();
      } else { showLock("set1"); $("lockMsg").textContent = "두 번 입력한 게 달라요. 다시 정해주세요"; }
    }
  } finally { pinBusy = false; }
}

// 지문: 이 기기의 지문/화면잠금으로만 확인 (서버로 아무것도 안 보냄)
async function setupBio(){
  try{
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: "Note" },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "note", displayName: "Note" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged" },
      timeout: 60000
    }});
    store.set("talk_bio", btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
    alert("지문 등록 완료! 다음부터 지문으로 열 수 있어요.");
  }catch{ alert("지문 등록이 취소됐거나 이 기기에서 지원하지 않아요."); }
}
async function unlockBio(){
  try{
    const id = Uint8Array.from(atob(store.get("talk_bio")), c => c.charCodeAt(0));
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: "public-key", id }],
      userVerification: "required", timeout: 60000
    }});
    hideLock(); sendRead();
  }catch{ $("lockMsg").textContent = "지문 확인이 안 됐어요. 비밀번호를 입력해 주세요"; }
}
function lockMenu(verified){
  if(!hasPin()) return showLock("set1");
  if(!verified) return showLock("check");
  const c = prompt("잠금 설정\n1 = 비밀번호 바꾸기\n2 = " + (hasBio() ? "지문 끄기" : "지문 켜기") + "\n3 = 잠금 끄기", "");
  if(c === "1") showLock("set1");
  else if(c === "2"){
    if(hasBio()){ store.del("talk_bio"); alert("지문을 껐어요."); }
    else if(bioOK()) setupBio(); else alert("이 기기/브라우저에서는 지문을 쓸 수 없어요.");
  }
  else if(c === "3"){ store.del("talk_pin"); store.del("talk_bio"); alert("잠금을 껐어요."); }
}

/* ───────── 이벤트 연결 (한 곳에서만) ───────── */
$("enter").onclick = enter;
$("room").addEventListener("keydown", e => { if(e.key === "Enter") enter(); });
$("send").addEventListener("submit", send);
// 전송 버튼을 눌러도 입력창 포커스(키보드)가 유지되게: 버튼이 포커스를 가져가지 않도록
$("send").querySelector("button").addEventListener("mousedown", e => e.preventDefault());
$("msg").addEventListener("input", resize);
$("msg").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("send").requestSubmit(); }
});
$("leave").onclick = () => {
  if(es) es.close(); es = null; store.del("talk_room"); showErr("");
  $("chat").classList.add("hidden"); $("join").classList.remove("hidden");
};
$("vib").onclick = () => {
  vibOn = !vibOn; store.set("talk_vib", vibOn ? "on" : "off"); showVib();
  if(vibOn && navigator.vibrate) navigator.vibrate(100);
};
$("ntfy").onclick = async () => {
  const withText = confirm("워치/알림에 메시지 내용도 보이게 할까요?\n\n확인 = 이름 + 내용 표시\n취소 = 점(·)만 표시");
  const t = withText ? contentTopic(myId) : pingTopic(myId);
  mySub = withText ? "pc" : "pg"; store.set("talk_sub", mySub);
  // 고른 방식을 상대에게 바로 알림 (읽음 위치는 그대로, 화면 포커스와 무관하게)
  if(tp) post(SERVER + tp + "-r", { type: "read", uid: myId, upTo: lastReadSent, sub: mySub }).catch(() => {});
  try{ await navigator.clipboard.writeText(t); }catch{}
  prompt("ntfy 앱에서 + 를 누르고 아래 이름을 붙여넣으세요. (이미 복사됐어요)\n※ 사람마다 이름이 달라요. 각자 자기 폰에서 눌러야 해요.", t);
};
$("lockSet").onclick = () => lockMenu(false);
// 기기 연결: 폰(기준)의 코드를 PC에 입력하면 두 기기가 같은 사람이 됨
$("link").onclick = async () => {
  const code = prompt(
    "📱 이 기기의 연결 코드: " + myId + "\n\n" +
    "같은 사람의 다른 기기를 연결하려면,\n그 기기에서 🔗를 누르고 위 코드를 입력하세요.\n\n" +
    "(다른 기기의 코드를 여기에 입력하면 이 기기가 그 기기와 같은 사람이 돼요)", "");
  if(code == null) return;
  const newId = code.trim().toLowerCase();
  if(!newId) return;
  if(newId === myId) return alert("이 기기 자신의 코드예요. 다른 기기에서 입력해 주세요.");
  if(!/^[a-z0-9]{6,16}$/.test(newId)) return alert("코드가 올바르지 않아요. 다시 확인해 주세요.");
  // 이 방에서 그 코드로 보낸 메시지의 닉네임을 찾아서, 내 닉네임과 다르면 막기
  let theirName = null;
  for(let i = order.length - 1; i >= 0; i--) if(order[i].uid === newId){ theirName = order[i].name; break; }
  if(theirName !== null && theirName !== me)
    return alert("⛔ 이 코드는 [" + theirName + "]님의 기기예요.\n내 다른 기기의 코드만 입력할 수 있어요.\n(두 기기의 닉네임을 똑같이 맞춰주세요)");
  if(theirName === null && !confirm("⚠️ 이 방에서 이 코드로 보낸 메시지를 찾지 못했어요.\n정말 내 다른 기기의 코드가 맞나요?\n(확실하지 않으면 그 기기에서 메시지를 하나 보낸 뒤 다시 해주세요)")) return;
  if(!confirm("이 기기를 코드 [" + newId + "] 기기와 같은 사람으로 연결할까요?")) return;
  aliases.add(myId); aliases.delete(newId);
  store.set("talk_alias", JSON.stringify([...aliases]));
  store.set("talk_id", newId);
  if(tp) try{ await post(SERVER + tp + "-r", { type: "alias", uid: newId, old: myId }); }catch{}
  alert("연결됐어요! 이제 두 기기가 같은 사람으로 보여요.");
  location.reload();
};
$("clear").onclick = () => {
  if(!confirm("이 폰에서 대화를 모두 지울까요?\n상대 폰에는 그대로 남아요.")) return;
  clearedAt = Date.now(); store.set("talk_clear_" + room, String(clearedAt));
  msgs = {}; order = []; clearTimeout(saveTimer); store.set("talk_hist_" + room, "{}");
  renderAll();
};
$("bioBtn").onclick = unlockBio;
$("forgot").onclick = () => {
  if(!confirm("잠금을 초기화할까요?\n보안을 위해 이 기기에 저장된 대화 기록도 함께 지워져요.\n(서버에 남은 최근 대화는 다시 불러와져요)")) return;
  Object.keys(localStorage).filter(k => k.startsWith("talk_hist_") || k === "talk_pin" || k === "talk_bio").forEach(k => store.del(k));
  location.reload();
};

// 잠금 화면에서 키보드 숫자 입력 (Backspace 지우기, Esc 취소)
document.addEventListener("keydown", e => {
  if($("lock").classList.contains("hidden")) return;
  e.preventDefault(); e.stopPropagation();
  if(/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if(e.key === "Backspace") pressKey("⌫");
  else if(e.key === "Escape") pressKey("취소");
}, true);

// 화면 복귀/포커스: 안 읽음 지우기 + 읽음 신호 + 잠금
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(hasPin() && hiddenAt && Date.now() - hiddenAt > LOCK_AFTER && !isLocked()){ showLock("unlock"); if(hasBio()) unlockBio(); }
  clearUnread(); sendRead();
});
window.addEventListener("focus", () => { clearUnread(); sendRead(); });
// 보고 있는 동안 터치/입력/스크롤 시 읽음 (sendRead는 보낼 게 없으면 바로 끝나서 가벼움)
for(const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, sendRead, { passive: true });
$("list").addEventListener("scroll", sendRead, { passive: true });
setInterval(sendRead, 4000);
window.addEventListener("pagehide", () => { clearTimeout(saveTimer); if(room) store.set("talk_hist_" + room, JSON.stringify(msgs)); });

/* ───────── 시작 ───────── */
try{ setIcon(false); }catch{}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
$("nick").value = store.get("talk_nick") || "";
$("room").value = store.get("talk_room") || "";
showVib();
buildLock();
if(hasPin()) showLock("unlock");
if(store.get("talk_nick") && store.get("talk_room")) enter();   // 다시 열어도 같은 방 자동 입장
</script>
